# Coolify: create a "Docker Compose" resource pointing at this repo.
# Set the domain on the `web` service (port 80). `app` stays internal.
services:
  app:
    build:
      context: .
      target: app
      args:
        # Mirror every VITE_* variable here — they are baked in at build time.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_MAP_TOKEN: ${VITE_MAP_TOKEN:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
