server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root /usr/share/nginx/html;

    include /etc/nginx/snippets/security-headers.conf;

    # Docker's embedded DNS. Resolving the upstream at request time (instead
    # of via an `upstream {}` block) keeps nginx bootable when the `app`
    # container is still starting or briefly down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream "http://app:3000";

    # --- internal healthcheck ---------------------------------------------
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- hashed build assets: immutable, never hit the SSR server ---------
    location ~* ^/(_build|assets)/ {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- other static files shipped in .output/public ---------------------
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm|txt|xml|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri @app;
    }

    # --- everything else: SSR, server functions, API ----------------------
    location / {
        try_files $uri @app;
    }

    location @app {
        proxy_pass $app_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # TanStack Start streams SSR HTML — buffering here would stall the
        # shell until the whole document is rendered.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_redirect     off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
