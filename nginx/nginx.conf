user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Coolify's proxy (Traefik/Caddy) terminates TLS and forwards the real
    # client IP in X-Forwarded-For. Trust the Docker bridge networks only.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout   65;
    client_max_body_size 25m;
    client_body_timeout  30s;
    client_header_timeout 30s;

    # $connection_upgrade is empty unless the client asked for a WebSocket,
    # so the Connection header stays correct for plain HTTP requests too.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Fall back to the scheme nginx actually served when no upstream proxy
    # set X-Forwarded-Proto (e.g. direct container access).
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/xml
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    include /etc/nginx/conf.d/*.conf;
}
